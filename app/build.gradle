plugins {
 id 'com.android.application'
 id 'org.jetbrains.kotlin.android'
 id 'org.jetbrains.kotlin.plugin.compose'
}
def signingProps = new Properties()
if (rootProject.file('signing.properties').exists()) rootProject.file('signing.properties').withInputStream { signingProps.load(it) }
android {
 namespace 'com.arnolee.moye'
 compileSdk 35
 defaultConfig { applicationId 'com.arnolee.moye'; minSdk 26; targetSdk 35; versionCode 10; versionName '1.3.4'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { compose true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs {
  release {
   if (!signingProps.isEmpty()) {
    storeFile rootProject.file(signingProps['storeFile'])
    storePassword signingProps['storePassword']
    keyAlias signingProps['keyAlias']
    keyPassword signingProps['keyPassword']
   }
  }
 }
 buildTypes { debug { applicationIdSuffix '.debug'; versionNameSuffix '-dev' }; release { minifyEnabled false; signingConfig signingConfigs.release } }
 packaging { resources.excludes += '/META-INF/{AL2.0,LGPL2.1}' }
}
dependencies {
 implementation platform('androidx.compose:compose-bom:2024.12.01')
 implementation 'androidx.activity:activity-compose:1.9.3'
 implementation 'androidx.compose.material3:material3'
 implementation 'androidx.compose.material:material-icons-extended'
 implementation 'androidx.compose.foundation:foundation'
 implementation 'androidx.compose.ui:ui-tooling-preview'
 debugImplementation 'androidx.compose.ui:ui-tooling'
 implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
 implementation 'io.coil-kt:coil-compose:2.7.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
 androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
 debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
